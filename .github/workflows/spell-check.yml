name: Spell check
on:
  push: &on_rules
    branches-ignore:
      - main
    paths:
      - src/**
      - docs/**
      - zensical.toml
  pull_request: *on_rules

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Run spell check
        run: make spell-check
