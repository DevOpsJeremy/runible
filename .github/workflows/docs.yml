name: Documentation
on:
  push:
    paths:
      - src/**
      - docs/**
      - zensical.toml
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          name: site
          path: site/
  deploy:
    needs: build
    if: github.ref == 'refs/heads/13-add-documentation'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifacts@v5
        with:
          name: site
          path: site
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
