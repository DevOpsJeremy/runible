# Global vars
# passed into playbook run as extra vars
vars:
  var1: val1

env:
  ANSIBLE_FORKS: 15

tags:
  - pb1
  - task1
  - pb2
  - pb3
steps:
  step1:
    run: playbooks/playbook1.yml
    vars:
      var2: val2
    env:
      ANSIBLE_NOCOLOR: true
    skip_tags: task1
  step2:
    after:
      - step1
    run: playbooks/playbook2.yml
    tags:
      - foo
  step3:
    after:
      - step1
    run: playbooks/playbook3.yml
    vars:
      var1: foo
    when:
      - step1 is failed
  step4:
    after:
      - step2
    run: playbooks/playbook4.yml

interface: workflow

